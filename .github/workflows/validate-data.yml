# Checks the data files on every pull request and push to dev or main.
# Runs on every pull request, not just ones into dev or main, because some of
# our task branches are stacked (task 2 goes into task 1, and so on) and those
# PRs weren't getting checked before.
name: Validate data

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tools
      - name: Check data files
        run: python tools/validate_data.py
