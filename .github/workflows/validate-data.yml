# Checks the data files on every pull request and push to dev or main
name: Validate data

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tools
      - name: Check data files
        run: python tools/validate_data.py
